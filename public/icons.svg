<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Consistent icon set in a Lucide-style outline grammar: 24x24 viewBox, stroke-width 2,
       round caps/joins, no fills (small solid accent dots are the only exception, matching
       Lucide's own convention e.g. "git-commit"). A few (spine, baby bottle, cane, two-hearts,
       spark-head) have no direct Lucide equivalent and are custom-drawn to the same grammar. -->
  <symbol id="icon-heart" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19.4 14.2 12 21l-7.4-6.8a5 5 0 1 1 7.4-6.7 5 5 0 1 1 7.4 6.7Z"/>
  </symbol>

  <symbol id="icon-camera" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.5 4h-5L7.2 6.5H4a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-3.2L14.5 4Z"/>
    <circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <symbol id="icon-chat" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 1 3 6.2L4 20l1.2-3.4A7.96 7.96 0 0 1 4 12Z"/>
  </symbol>

  <!-- Quiropraxia: spinal curvature -->
  <symbol id="icon-spine" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 2c6 2.5 6 6 0 8.5s-6 6 0 8.5"/>
    <circle cx="10" cy="2" r="1.3" fill="currentColor"/>
    <circle cx="10" cy="19" r="1.3" fill="currentColor"/>
  </symbol>

  <!-- Fisioterapia Ortopédica: medical cross -->
  <symbol id="icon-cross" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 8v8M8 12h8"/>
  </symbol>

  <!-- Fisioterapia Neurológica: nerve signal -->
  <symbol id="icon-spark-head" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 7 8.5 13.5h3.2L10.8 19l5.7-7.5h-3.4Z"/>
  </symbol>

  <!-- Fisioterapia Geriátrica: walking cane -->
  <symbol id="icon-cane" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 3c-2.2 0-4 1.6-4 3.6 0 1.3.8 2.4 2 3l-3 11.4"/>
  </symbol>

  <!-- Fisioterapia Esportiva: activity / pulse -->
  <symbol id="icon-pulse" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 13h3.5l2-4 3 8 2-6 1.5 2H21"/>
  </symbol>

  <!-- Fisioterapia Pélvica / Gestante: mother & child care -->
  <symbol id="icon-two-hearts" viewBox="0 0 24 24">
    <use href="#icon-heart" transform="translate(-1.5,-1.5) scale(0.62)"/>
    <use href="#icon-heart" transform="translate(9,9) scale(0.55)"/>
  </symbol>

  <!-- Fisioterapia Infantil: baby bottle -->
  <symbol id="icon-baby-bottle" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9.5 4.5h5v4h-5z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.5h9v11a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2Z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7.5 13.5h9"/>
  </symbol>

  <!-- Atendimento Domiciliar: home visit -->
  <symbol id="icon-home" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 9.8 12 3l9 6.8V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H4a1 1 0 0 1-1-1Z"/>
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.3l3 3 6-6.6"/>
  </symbol>

  <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 17 17 7M7 7h10v10"/>
  </symbol>

  <symbol id="icon-arrow-down" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M19 12l-7 7-7-7"/>
  </symbol>

  <symbol id="icon-arrow-up" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>
  </symbol>

  <symbol id="icon-arrow-left" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"/>
  </symbol>

  <!-- Brand signature mark: reused as the scroll-progress marker and in the background pattern -->
  <symbol id="icon-spark" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 2 5.5 14h4.7L11 22l7.5-12h-4.7Z"/>
  </symbol>

  <!-- Official WhatsApp glyph (solid brand mark, not the outline grammar above) —
       used only on the floating WhatsApp button, where brand recognition matters more
       than style consistency with the rest of the icon set. -->
  <symbol id="icon-whatsapp" viewBox="0 0 448 512">
    <path fill="currentColor" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-70 18.4 18.7-68.2-4.4-7C49.7 320.9 40 295.5 40 254.1c0-101.9 82.9-184.8 184.9-184.8 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.6 81.2 56.6 130.5 0 101.9-84.9 184.8-186.9 184.8h-1.1zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.7-3.2 3.7-6.5 4.1-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.6-9.7-1.5-2.8-13.4-32.3-18.4-44.2-4.9-11.8-9.9-10.2-13.6-10.4-3.5-.2-7.5-.2-11.5-.2-4 0-10.5 1.5-16.1 7.4-5.6 5.9-21.4 20.9-21.4 51 0 30.1 21.9 59.2 24.9 63.3 3 4.1 41.3 63 100.1 85.8 49.9 19.4 60.1 15.6 71 14.6 10.9-1 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.4-5-3.8-10.5-6.6z"/>
  </symbol>
</svg>
